<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <link rel="icon" href="/tools/favicon.svg" type="image/svg+xml" />
        <title>Delivery zone fees</title>
        <style>
            :root {
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                --bg: #e9efe6;
                --page: #fffffb;
                --ink: #222222;
                --muted: #666666;
                --line: #8a8f99;
                --soft: #c9d0d8;
                --band: #1f3b73;
                --bandink: #ffffff;
                --th: #cfdff2;
                --th2: #eaf1fa;
                --alt: #fbfaf3;
                --accent: #c8161d;
                --link: #0033cc;
                --note: #b3261e;
                --chip: #fff8dc;
                --chipline: #d9c98a;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #14181f;
                    --page: #1c212b;
                    --ink: #e8e8e8;
                    --muted: #a0a6b0;
                    --line: #5c6574;
                    --soft: #3a4250;
                    --band: #2b4a8c;
                    --bandink: #ffffff;
                    --th: #2a3a57;
                    --th2: #232d42;
                    --alt: #20262f;
                    --accent: #ff6a6a;
                    --link: #8fb0ff;
                    --note: #ff8d84;
                    --chip: #3a3520;
                    --chipline: #6b6137;
                }
            }
            :root[data-theme="dark"] {
                --bg: #14181f;
                --page: #1c212b;
                --ink: #e8e8e8;
                --muted: #a0a6b0;
                --line: #5c6574;
                --soft: #3a4250;
                --band: #2b4a8c;
                --bandink: #ffffff;
                --th: #2a3a57;
                --th2: #232d42;
                --alt: #20262f;
                --accent: #ff6a6a;
                --link: #8fb0ff;
                --note: #ff8d84;
                --chip: #3a3520;
                --chipline: #6b6137;
            }
            *,
            *::before,
            *::after {
                box-sizing: inherit;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                padding: 16px 8px 40px;
                background: var(--bg);
                color: var(--ink);
                font:
                    13px/1.7 "Hiragino Kaku Gothic ProN",
                    "Hiragino Sans",
                    Meiryo,
                    "MS PGothic",
                    "Yu Gothic",
                    Osaka,
                    "Helvetica Neue",
                    Arial,
                    sans-serif;
                background-image: radial-gradient(
                    var(--soft) 1px,
                    transparent 1px
                );
                background-size: 6px 6px;
            }
            main {
                max-width: 900px;
                margin: 0 auto;
                background: var(--page);
                border: 1px solid var(--line);
                box-shadow: 3px 3px 0 var(--soft);
            }
            header.band {
                background: var(--band);
                color: var(--bandink);
                padding: 10px 16px;
                border-bottom: 3px double var(--bandink);
            }
            h1 {
                font-size: 20px;
                margin: 0;
                font-weight: bold;
                letter-spacing: 0.08em;
            }
            .stripe {
                height: 4px;
                background: repeating-linear-gradient(
                    90deg,
                    var(--accent) 0 12px,
                    var(--page) 12px 16px
                );
            }
            .body {
                padding: 14px 16px 20px;
            }
            .sub {
                margin: 0 0 12px;
                color: var(--muted);
            }
            .sub::before {
                content: "\203B\00A0";
                color: var(--note);
            }
            h2 {
                font-size: 14px;
                margin: 18px 0 6px;
                padding: 2px 8px;
                border-left: 6px solid var(--accent);
                border-bottom: 1px dotted var(--line);
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }
            table.form th,
            table.form td,
            table.res th,
            table.res td {
                border: 1px solid var(--line);
                padding: 6px 10px;
                text-align: left;
                vertical-align: top;
            }
            table.form th {
                background: var(--th);
                width: 28%;
                font-weight: bold;
                white-space: nowrap;
            }
            .hint {
                display: block;
                font-weight: normal;
                font-size: 11px;
                color: var(--muted);
                white-space: normal;
            }
            input[type="file"] {
                width: 100%;
                font: inherit;
                color: var(--ink);
            }
            input:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }

            .status {
                margin: 10px 0 0;
                padding: 4px 8px;
                background: var(--th2);
                border: 1px solid var(--soft);
                font-size: 12px;
            }
            .note {
                margin-top: 8px;
                color: var(--note);
                font-size: 12px;
            }
            .note::before {
                content: "\203B\00A0";
            }

            .wrap {
                margin-top: 6px;
                overflow-x: auto;
            }
            table.res {
                min-width: 560px;
                border: 2px solid var(--line);
            }
            table.res thead th {
                background: var(--th);
                text-align: center;
                font-weight: bold;
                border-bottom: 2px solid var(--line);
            }
            table.res tbody tr:nth-child(even) td {
                background: var(--alt);
            }
            table.res td.zone {
                background: var(--th2) !important;
                font-weight: bold;
                white-space: nowrap;
                width: 18%;
            }
            td.codes {
                width: 44%;
            }
            .chip {
                display: inline-block;
                margin: 0 3px 3px 0;
                padding: 0 5px;
                background: var(--chip);
                border: 1px solid var(--chipline);
                font-variant-numeric: tabular-nums;
                font-size: 12px;
                line-height: 1.5;
            }
            .count {
                color: var(--muted);
                font-size: 11px;
                margin-top: 2px;
            }
            .count::before {
                content: "\203B\00A0";
            }
            ul.fees {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            ul.fees li {
                padding-left: 1em;
                text-indent: -1em;
            }
            ul.fees li::before {
                content: "\25A0\00A0";
                color: var(--accent);
                font-size: 10px;
            }
            ul.fees li + li {
                margin-top: 4px;
            }

            .cell {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                justify-content: space-between;
            }
            .cell > .body {
                flex: 1;
                min-width: 0;
                padding: 0;
            }
            .copy {
                flex: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 24px;
                height: 24px;
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 0;
                background: linear-gradient(var(--page), var(--th2));
                color: var(--ink);
                cursor: pointer;
            }
            .copy:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .copy:active {
                background: var(--th);
            }
            .copy:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }
            .copy.done {
                color: #1a7f37;
                border-color: #1a7f37;
            }
            .copy svg {
                width: 14px;
                height: 14px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .empty {
                padding: 20px 12px;
                color: var(--muted);
                text-align: center;
                border: 1px solid var(--line);
                background: var(--alt);
            }
            footer {
                border-top: 1px solid var(--line);
                padding: 6px;
                text-align: center;
                font-size: 11px;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <main>
            <header class="band"><h1>【 Delivery zone fees 】</h1></header>
            <div class="stripe"></div>
            <div class="body">
                <p class="sub">
                    Load the zones CSV and the locations CSV to see the fee for
                    each delivery zone.
                </p>

                <h2>Upload files</h2>
                <table class="form">
                    <tr>
                        <th scope="row"><label for="file">Zones CSV</label></th>
                        <td>
                            <input
                                id="file"
                                type="file"
                                accept=".csv,text/csv"
                            />
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">
                            <label for="locfile">Locations CSV</label
                            ><span class="hint"
                                >Reads the valid_delivery_postal_codes
                                column</span
                            >
                        </th>
                        <td>
                            <input
                                id="locfile"
                                type="file"
                                accept=".csv,text/csv"
                            />
                        </td>
                    </tr>
                </table>

                <p class="status" id="status" aria-live="polite">
                    No CSVs loaded yet.
                </p>

                <h2>Delivery fees by zone</h2>
                <div id="note"></div>
                <div class="wrap" id="result">
                    <div class="empty">Results will appear here.</div>
                </div>
            </div>
            <footer>Delivery zone fee checker</footer>
        </main>

        <script>
            (function () {
                var zones = []; // [{name, codes:Set, rates:[{price,min,max}]}]
                var fileEl = document.getElementById("file");
                var locEl = document.getElementById("locfile");
                var validCodes = [];
                var zonesMsg = "No zones CSV loaded.",
                    locMsg = "No locations CSV loaded.";
                var statusEl = document.getElementById("status");
                var noteEl = document.getElementById("note");
                var resultEl = document.getElementById("result");

                // Minimal RFC 4180 CSV parser (quoted fields, escaped quotes, newlines in quotes)
                function parseCSV(text) {
                    var rows = [],
                        row = [],
                        f = "",
                        q = false,
                        i = 0;
                    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
                    for (; i < text.length; i++) {
                        var c = text[i];
                        if (q) {
                            if (c === '"') {
                                if (text[i + 1] === '"') {
                                    f += '"';
                                    i++;
                                } else q = false;
                            } else f += c;
                        } else if (c === '"') q = true;
                        else if (c === ",") {
                            row.push(f);
                            f = "";
                        } else if (c === "\n" || c === "\r") {
                            if (c === "\r" && text[i + 1] === "\n") i++;
                            row.push(f);
                            f = "";
                            rows.push(row);
                            row = [];
                        } else f += c;
                    }
                    if (f !== "" || row.length) {
                        row.push(f);
                        rows.push(row);
                    }
                    return rows.filter(function (r) {
                        return r.length > 1 || (r[0] && r[0].trim());
                    });
                }

                function num(v) {
                    var n = parseFloat(v);
                    return isNaN(n) ? 0 : n;
                }
                function money(n) {
                    return "$" + (Number.isInteger(n) ? n : n.toFixed(2));
                }

                // price = delivery fee, min/max = order value range the rate applies to
                function describe(r) {
                    var p = r.price,
                        lo = r.min,
                        hi = r.max;
                    if (hi > 0 && lo > 0)
                        return (
                            "Delivery is " +
                            (p ? money(p) : "free") +
                            " for orders between " +
                            money(lo) +
                            " and " +
                            money(hi) +
                            "."
                        );
                    if (hi > 0)
                        return (
                            (p
                                ? "Delivery is " + money(p)
                                : "Delivery is free") +
                            " for orders up to " +
                            money(hi) +
                            "."
                        );
                    if (lo > 0)
                        return p
                            ? "Delivery is " +
                                  money(p) +
                                  " for orders over " +
                                  money(lo) +
                                  "."
                            : "Free delivery for orders over " +
                                  money(lo) +
                                  ".";
                    return p
                        ? "A flat " + money(p) + " delivery fee applies."
                        : "Delivery is free.";
                }

                function load(text) {
                    var rows = parseCSV(text);
                    if (!rows.length) {
                        zones = [];
                        return "The CSV is empty.";
                    }
                    var head = rows[0].map(function (h) {
                        return h.trim().toLowerCase();
                    });
                    var ix = function (n) {
                        return head.indexOf(n);
                    };
                    var need = [
                        "zone_handle",
                        "zone_name",
                        "zip_codes",
                        "rate_price",
                        "rate_min",
                        "rate_max",
                    ];
                    var missing = need.filter(function (n) {
                        return ix(n) < 0;
                    });
                    if (missing.length) {
                        zones = [];
                        return "Missing columns: " + missing.join(", ") + ".";
                    }

                    var byHandle = {},
                        order = [],
                        skipped = 0;
                    rows.slice(1).forEach(function (r) {
                        var status =
                            ix("zone_status") >= 0
                                ? (r[ix("zone_status")] || "").trim()
                                : "1";
                        var h = r[ix("zone_handle")];
                        if (status === "0") {
                            skipped++;
                            return;
                        }
                        var z = byHandle[h];
                        if (!z) {
                            z = byHandle[h] = {
                                name: r[ix("zone_name")],
                                codes: new Set(),
                                rates: [],
                                seen: {},
                            };
                            order.push(z);
                        }
                        r[ix("zip_codes")]
                            .split(/[\s,]+/)
                            .forEach(function (c) {
                                if (c) z.codes.add(c);
                            });
                        // translations repeat a rate on extra rows, so de-duplicate by rate handle (or values)
                        var rh =
                            ix("rate_handle") >= 0 ? r[ix("rate_handle")] : "";
                        var rate = {
                            price: num(r[ix("rate_price")]),
                            min: num(r[ix("rate_min")]),
                            max: num(r[ix("rate_max")]),
                        };
                        var key =
                            rh || [rate.price, rate.min, rate.max].join("|");
                        if (!z.seen[key]) {
                            z.seen[key] = 1;
                            z.rates.push(rate);
                        }
                    });
                    zones = order;
                    return (
                        "Loaded " +
                        zones.length +
                        " zone" +
                        (zones.length === 1 ? "" : "s") +
                        "." +
                        (skipped
                            ? " " +
                              skipped +
                              " inactive row" +
                              (skipped === 1 ? "" : "s") +
                              " skipped."
                            : "")
                    );
                }

                function el(tag, cls, text) {
                    var e = document.createElement(tag);
                    if (cls) e.className = cls;
                    if (text != null) e.textContent = text;
                    return e;
                }

                var ICON_COPY =
                    '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
                var ICON_OK =
                    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

                function copyText(text) {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        return navigator.clipboard
                            .writeText(text)
                            .catch(function () {
                                return fallbackCopy(text);
                            });
                    }
                    return fallbackCopy(text);
                }
                function fallbackCopy(text) {
                    return new Promise(function (resolve, reject) {
                        var ta = document.createElement("textarea");
                        ta.value = text;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.select();
                        var ok = false;
                        try {
                            ok = document.execCommand("copy");
                        } catch (e) {}
                        document.body.removeChild(ta);
                        ok ? resolve() : reject();
                    });
                }

                // Wraps cell content with a copy button that copies `text`
                function copyCell(td, bodyNodes, text, label) {
                    var wrap = el("div", "cell"),
                        body = el("div", "body");
                    bodyNodes.forEach(function (n) {
                        body.appendChild(n);
                    });
                    var btn = el("button", "copy");
                    btn.type = "button";
                    btn.title = label;
                    btn.setAttribute("aria-label", label);
                    btn.innerHTML = ICON_COPY;
                    btn.addEventListener("click", function () {
                        copyText(text).then(
                            function () {
                                btn.innerHTML = ICON_OK;
                                btn.classList.add("done");
                                btn.title = "Copied";
                                setTimeout(function () {
                                    btn.innerHTML = ICON_COPY;
                                    btn.classList.remove("done");
                                    btn.title = label;
                                }, 1200);
                            },
                            function () {
                                btn.title = "Copy failed";
                            },
                        );
                    });
                    wrap.appendChild(body);
                    wrap.appendChild(btn);
                    td.appendChild(wrap);
                }

                function render() {
                    noteEl.textContent = "";
                    resultEl.textContent = "";
                    if (!zones.length) {
                        resultEl.appendChild(
                            el("div", "empty", "Load a zones CSV to begin."),
                        );
                        return;
                    }

                    var valid = validCodes;
                    if (!valid.length) {
                        resultEl.appendChild(
                            el(
                                "div",
                                "empty",
                                "Load a locations CSV to choose which postcodes to show.",
                            ),
                        );
                        return;
                    }

                    var found = {},
                        rows = [];
                    zones.forEach(function (z) {
                        var hits = valid.filter(function (c) {
                            return z.codes.has(c);
                        });
                        if (hits.length) {
                            hits.forEach(function (c) {
                                found[c] = 1;
                            });
                            rows.push({ z: z, hits: hits });
                        }
                    });

                    var missing = valid.filter(function (c) {
                        return !found[c];
                    });
                    if (missing.length) {
                        var n = el(
                            "div",
                            "note",
                            "Not in any zone (" +
                                missing.length +
                                "): " +
                                missing.join(", "),
                        );
                        noteEl.appendChild(n);
                    }
                    if (!rows.length) {
                        resultEl.appendChild(
                            el(
                                "div",
                                "empty",
                                "None of those postcodes are in a zone.",
                            ),
                        );
                        return;
                    }

                    var t = el("table", "res");
                    var thead = el("thead"),
                        hr = el("tr");
                    ["Zone", "Postcodes", "Delivery fee"].forEach(function (h) {
                        var th = el("th", null, h);
                        th.scope = "col";
                        hr.appendChild(th);
                    });
                    thead.appendChild(hr);
                    t.appendChild(thead);
                    var tb = el("tbody");
                    rows.forEach(function (r) {
                        var tr = el("tr");
                        tr.appendChild(el("td", "zone", r.z.name));
                        var tdc = el("td", "codes"),
                            nodes = [];
                        r.hits.forEach(function (c) {
                            nodes.push(el("span", "chip", c));
                        });
                        nodes.push(
                            el(
                                "div",
                                "count",
                                r.hits.length +
                                    " postcode" +
                                    (r.hits.length === 1 ? "" : "s"),
                            ),
                        );
                        copyCell(
                            tdc,
                            nodes,
                            r.hits.join(", "),
                            "Copy postcodes",
                        );
                        tr.appendChild(tdc);
                        var tdf = el("td", "feecell"),
                            ul = el("ul", "fees"),
                            lines = [];
                        r.z.rates.forEach(function (rt) {
                            var d = describe(rt);
                            lines.push(d);
                            ul.appendChild(el("li", null, d));
                        });
                        copyCell(
                            tdf,
                            [ul],
                            lines.join("\n"),
                            "Copy delivery fee",
                        );
                        tr.appendChild(tdf);
                        tb.appendChild(tr);
                    });
                    t.appendChild(tb);
                    var wrap = el("div");
                    resultEl.appendChild(t);
                }

                function setStatus() {
                    statusEl.textContent = zonesMsg + " " + locMsg;
                }

                function loadLocations(text) {
                    var rows = parseCSV(text);
                    validCodes = [];
                    if (!rows.length) return "The locations CSV is empty.";
                    var col = rows[0]
                        .map(function (h) {
                            return h.trim().toLowerCase();
                        })
                        .indexOf("valid_delivery_postal_codes");
                    if (col < 0)
                        return "No valid_delivery_postal_codes column found.";
                    var seen = {};
                    rows.slice(1).forEach(function (r) {
                        (r[col] || "").split(/[\s,]+/).forEach(function (c) {
                            if (c && !seen[c]) {
                                seen[c] = 1;
                                validCodes.push(c);
                            }
                        });
                    });
                    return (
                        "Loaded " +
                        validCodes.length +
                        " valid postcodes from " +
                        (rows.length - 1) +
                        " location" +
                        (rows.length === 2 ? "" : "s") +
                        "."
                    );
                }

                function readFile(input, cb, errMsg) {
                    var f = input.files[0];
                    if (!f) return;
                    var rd = new FileReader();
                    rd.onload = function () {
                        cb(String(rd.result));
                        setStatus();
                        render();
                    };
                    rd.onerror = function () {
                        cb(null);
                    };
                    rd.readAsText(f);
                }

                fileEl.addEventListener("change", function () {
                    readFile(fileEl, function (t) {
                        zonesMsg =
                            t == null
                                ? "Could not read the zones file."
                                : load(t);
                    });
                });
                locEl.addEventListener("change", function () {
                    readFile(locEl, function (t) {
                        locMsg =
                            t == null
                                ? "Could not read the locations file."
                                : loadLocations(t);
                    });
                });
            })();
        </script>
    </body>
</html>
